<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparação de parâmetros — novo modelo × NEWAVE</title>
<style>/*__ESTILOS__*/</style>
</head>
<body>
<header><div class="limite"><p class="sobretitulo">PAR(p)-A · comparação de parâmetros armazenados</p><h1>Novo modelo × NEWAVE</h1><p id="identificacao"></p></div></header>
<main class="limite">
  <section class="filtros" aria-label="Filtros de todas as abas">
    <label class="busca">Buscar usina por nome ou ID<input id="busca" type="search" placeholder="Todas as usinas · digite para buscar" autocomplete="off"></label>
    <label>De<select id="inicio" aria-label="Mês inicial"></select></label>
    <label>Até<select id="fim" aria-label="Mês final"></select></label>
    <button id="limpar" type="button" class="secundario">Limpar filtros</button>
    <p id="escopo" role="status" aria-live="polite"></p>
  </section>
  <nav class="abas" aria-label="Comparações" role="tablist">
    <button id="aba-geral" role="tab" aria-controls="conteudo" data-tab="geral" aria-selected="true">Visão geral</button>
    <button id="aba-ordem" role="tab" aria-controls="conteudo" data-tab="ordem" aria-selected="false" tabindex="-1">Ordem PARP</button>
    <button id="aba-mensais" role="tab" aria-controls="conteudo" data-tab="mensais" aria-selected="false" tabindex="-1">Coeficientes mensais</button>
    <button id="aba-anual" role="tab" aria-controls="conteudo" data-tab="anual" aria-selected="false" tabindex="-1">Coeficiente anual</button>
    <button id="aba-medias_mensais" role="tab" aria-controls="conteudo" data-tab="medias_mensais" aria-selected="false" tabindex="-1">Médias mensais</button>
    <button id="aba-medias_anuais" role="tab" aria-controls="conteudo" data-tab="medias_anuais" aria-selected="false" tabindex="-1">Médias anuais</button>
    <button id="aba-desvio_mensal" role="tab" aria-controls="conteudo" data-tab="desvio_mensal" aria-selected="false" tabindex="-1">Desvio padrão mensal</button>
    <button id="aba-desvio_anual" role="tab" aria-controls="conteudo" data-tab="desvio_anual" aria-selected="false" tabindex="-1">Desvio padrão anual</button>
  </nav>
  <p class="legenda"><span class="selo dentro">Dentro da tolerância</span> aprovado <span class="selo fora">Fora da tolerância</span> reprovado por diferença &gt; tolerância <span class="selo sc">sc</span> reprovado sem comparação: ordens diferentes ou lag ativo em apenas um modelo</p>
  <div id="conteudo" role="tabpanel" aria-labelledby="aba-geral"></div>
  <footer id="rodape"></footer>
</main>
<noscript><p>Ative o JavaScript do navegador para consultar as tabelas deste relatório local.</p></noscript>
<script id="dados" type="application/json">__DADOS_JSON__</script>
<script>/*__INTERACAO__*/</script>
</body>
</html>
